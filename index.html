<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1220;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
h1{font-size:28px}
.stats{display:flex;gap:24px;font-size:18px}
canvas{background:#111c33;border:3px solid #22c55e;border-radius:8px;max-width:100%}
.hint{color:#94a3b8;font-size:14px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.pad button{height:56px;border:none;border-radius:10px;background:#1e293b;color:#fff;font-size:22px;cursor:pointer}
.pad button:active{background:#22c55e}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.btn{padding:10px 20px;border:none;border-radius:8px;background:#22c55e;color:#052e16;font-weight:700;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div class="stats"><span>Score: <b id="score">0</b></span><span>High score: <b id="high">0</b></span></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="hint">Arrow keys or WASD to move · Space to pause · Enter to restart</div>
<div class="pad">
  <button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button>
  <button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button>
</div>
<button class="btn" id="restart">Restart</button>

<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const SIZE = 20, CELLS = canvas.width / SIZE;
let snake, dir, nextDir, food, score, high = 0, loop, paused, over, speed;
try { high = Number(localStorage.getItem('snakeHigh')) || 0; } catch (e) {}
document.getElementById('high').textContent = high;

const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = DIRS.right; nextDir = dir;
  score = 0; paused = false; over = false; speed = 130;
  document.getElementById('score').textContent = 0;
  placeFood();
  clearInterval(loop);
  loop = setInterval(tick, speed);
  draw();
}

function placeFood() {
  do { food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function setDir(name) {
  const d = DIRS[name];
  if (d.x === -dir.x && d.y === -dir.y) return; // no reversing
  nextDir = d;
}

function tick() {
  if (paused || over) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score % 5 === 0 && speed > 60) { speed -= 10; clearInterval(loop); loop = setInterval(tick, speed); }
    placeFood();
  } else snake.pop();
  draw();
}

function gameOver() {
  over = true;
  if (score > high) {
    high = score;
    document.getElementById('high').textContent = high;
    try { localStorage.setItem('snakeHigh', high); } catch (e) {}
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#111c33'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#86efac' : '#22c55e';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
  if (over || paused) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText(over ? 'Game Over' : 'Paused', canvas.width / 2, canvas.height / 2 - 6);
    ctx.font = '16px sans-serif';
    ctx.fillText(over ? 'Press Enter to play again' : 'Press Space to resume', canvas.width / 2, canvas.height / 2 + 22);
  }
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down',
                ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right' };
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
  else if (e.key === ' ') { e.preventDefault(); if (!over) { paused = !paused; draw(); } }
  else if (e.key === 'Enter') init();
});
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => setDir(b.dataset.d)));
document.getElementById('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
